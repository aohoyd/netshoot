package:
  name: dust
  version: 1.2.4
  epoch: 0
  description: du + rust = dust. Like du but more intuitive
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime: []
  target-architecture:
    - x86_64
    - aarch64

environment:
  contents:
    repositories:
      - https://dl-cdn.alpinelinux.org/alpine/edge/main
    packages:
      - busybox
      - ca-certificates-bundle

pipeline:
  - uses: fetch
    if: ${{build.arch}} == 'x86_64'
    with:
      uri: https://github.com/bootandy/dust/releases/download/v${{package.version}}/dust-v${{package.version}}-${{build.arch}}-unknown-linux-musl.tar.gz
      expected-sha256: 4e313f9f854017e58a2ada4c0d1774677b8cf53d63ab55a991d5871d5f504452

  - uses: fetch
    if: ${{build.arch}} == 'aarch64'
    with:
      uri: https://github.com/bootandy/dust/releases/download/v${{package.version}}/dust-v${{package.version}}-${{build.arch}}-unknown-linux-musl.tar.gz
      expected-sha256: e09b0d24b5da0fa06aecf1561849c13ae41ef055c1ce7077e35e9a46744b16af

  - runs: |
      install -Dm755 dust "${{targets.destdir}}/usr/bin/dust"

update:
  enabled: true
  github:
    identifier: bootandy/dust
    strip-prefix: v
    use-tag: true
